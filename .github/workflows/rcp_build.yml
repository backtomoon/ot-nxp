name: Build MCXW72 OpenThread

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (bootstrap)
        run: |
          chmod +x script/bootstrap
          ./script/bootstrap

      - name: Install ARM GCC 14.2
        run: |
          ARCH=$(arch)
          cd /tmp
          wget --tries=4 --no-check-certificate --quiet -c \
          https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-${ARCH}-arm-none-eabi.tar.xz
          sudo tar -xJf arm-gnu-toolchain-14.2.rel1-${ARCH}-arm-none-eabi.tar.xz -C /opt
          sudo ln -s -f /opt/arm-gnu-toolchain-14.2.rel1-${ARCH}-arm-none-eabi /opt/arm-gcc-14
          echo "ARMGCC_DIR=/opt/arm-gcc-14" >> $GITHUB_ENV
          echo "/opt/arm-gcc-14/bin" >> $GITHUB_PATH
          /opt/arm-gcc-14/bin/arm-none-eabi-gcc --version
    
      - name: Install west
        run: |
          pip3 install --user -U west
          echo "$HOME/.local/bin" >> $GITHUB_PATH  

      - name: Download NXP MCXW72 SDK
        run: |
          chmod +x third_party/nxp_matter_support/scripts/update_nxp_sdk.py
          ./third_party/nxp_matter_support/scripts/update_nxp_sdk.py --platform common

      - name: Set environment variables
        run: |
          echo "ARMGCC_DIR=/opt/arm-gcc-14" >> $GITHUB_ENV
          source ./third_party/nxp_matter_support/github_sdk/sdk_next/repo/mcuxsdk/mcux-env.sh
          echo "ZEPHYR_BASE=$ZEPHYR_BASE" >> $GITHUB_ENV
          west mcuxsdk-export

      - name: Build MCXW72 examples
        run: |
          chmod +x script/build_mcxw72
          ./script/build_mcxw72

      - name: Generate build directory tree
        run: |
          sudo apt-get install -y tree || true
          tree build_mcxw72 > build_tree.txt

      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: build-tree
          path: build_tree.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcxw72-firmware
          path: build_mcxw72/bin/
